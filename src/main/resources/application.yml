spring:
  application:
    name: ai-document-agent

  config:
    import: "optional:file:.env[.properties]"

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=3000&socketTimeout=5000
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      validation-timeout: 3000

  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD}
      connect-timeout: 3s
      timeout: 3s

  rabbitmq:
    connection-timeout: 3s
    requested-heartbeat: 15s

  elasticsearch:
    connection-timeout: 3s
    socket-timeout: 5s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    vectorstore:
      qdrant:
        initialize-schema: false

server:
  port: 8080

management:
  health:
    elasticsearch:
      enabled: false
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
